name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # Masuk ke direktori yang benar sesuai File Manager cPanel
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # Konfigurasi agar git mengizinkan direktori ini
            git config --global --add safe.directory /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # Cek jika folder masih kosong, lakukan inisialisasi awal
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:mahinmahmud11/cbn-laravel.git
              git fetch origin staging
              git checkout -f staging
            else
              # Jika sudah ada git, cukup tarik kode terbaru
              git pull origin staging
            fi
            
            # Jalankan perintah standar Laravel
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear