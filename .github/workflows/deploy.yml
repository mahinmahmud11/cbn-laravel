name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi dan Pastikan Folder Ada
            mkdir -p /home/u7942055/public_html/dev.citrabuananusantara.com
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. Fresh Clone via HTTPS (Jika folder kosong)
            if [ ! -d ".git" ]; then
                echo "Melakukan Fresh Clone via HTTPS..."
                rm -rf * .[^.]* # Hapus sisa file tersembunyi
                git clone -b staging https://github.com/mahinmahmud11/cbn-laravel.git .
            else
                echo "Sinkronisasi kode..."
                git config --global --add safe.directory $(pwd)
                git fetch origin staging
                git reset --hard origin/staging
            fi
            
            # 3. Konfigurasi .env (Force Update)
            echo "Mengonfigurasi file .env..."
            cp .env.example .env
            sed -i "s/DB_HOST=127.0.0.1/DB_HOST=localhost/g" .env
            sed -i "s/DB_DATABASE=laravel/DB_DATABASE=${{ secrets.DB_DATABASE }}/g" .env
            sed -i "s/DB_USERNAME=root/DB_USERNAME=${{ secrets.DB_USERNAME }}/g" .env
            sed -i "s/DB_PASSWORD=/DB_PASSWORD=${{ secrets.DB_PASSWORD }}/g" .env
            php artisan key:generate --force
            
            # 4. Instalasi & Optimasi
            echo "Menginstal dependensi..."
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # 5. Eksekusi Migrasi
            echo "Menjalankan migrasi database..."
            php artisan migrate --force
            
            # 6. Buat installer darurat di public/
            echo "<?php
            define('LARAVEL_START', microtime(true));
            require __DIR__.'/../vendor/autoload.php';
            \$app = require_once __DIR__.'/../bootstrap/app.php';
            \$kernel = \$app->make(Illuminate\Contracts\Console\Kernel::class);
            echo '<h1>Deployment Berhasil!</h1><p>Database sudah dimigrasi.</p>';
            " > public/index-ok.php
            
            php artisan optimize:clear
            echo "🎉 SUPER INSTALLER SELESAI!"