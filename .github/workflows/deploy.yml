name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. Ambil Kode Bersih dari GitHub (Sinkronisasi)
            git config --global --add safe.directory $(pwd)
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. KUDETA JALANKAN.PHP (Ganti script manual dengan script Laravel asli)
            echo "<?php
            define('LARAVEL_START', microtime(true));
            require __DIR__.'/../vendor/autoload.php';
            \$app = require_once __DIR__.'/../bootstrap/app.php';
            \$kernel = \$app->make(Illuminate\Contracts\Console\Kernel::class);
            
            echo '<h1>Laravel Migration System (Official)</h1>';
            echo '<pre>';
            try {
                \$status = \$kernel->call('migrate', ['--force' => true]);
                echo \Illuminate\Support\Facades\Artisan::output();
                echo '\n\n✅ Migrasi Selesai!';
            } catch (\Exception \$e) {
                echo '❌ Error: ' . \$e->getMessage();
            }
            echo '</pre>';
            " > public/jalankan.php
            
            # 4. Sinkronisasi & Optimasi
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            echo "🎉 Deployment Selesai!"