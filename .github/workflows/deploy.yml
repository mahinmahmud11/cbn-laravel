name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. PEMBERSIHAN TOTAL (Setara hapus folder)
            echo "Menghapus semua file kecuali .git dan .env..."
            find . -maxdepth 1 ! -name '.git' ! -name '.env' ! -name '.' -exec rm -rf {} +
            
            # 3. Ambil Kode Bersih dari GitHub
            git config --global --add safe.directory $(pwd)
            git checkout .
            git fetch origin staging
            git reset --hard origin/staging
            
            # 4. RESET DATABASE SECARA TOTAL (Manual SQL)
            echo "Mereset Database..."
            mysql -u${{ secrets.DB_USERNAME }} -p${{ secrets.DB_PASSWORD }} -e "
                SET FOREIGN_KEY_CHECKS = 0;
                SET @tables = NULL;
                SELECT GROUP_CONCAT('\`', table_name, '\`') INTO @tables
                  FROM information_schema.tables
                  WHERE table_schema = '${{ secrets.DB_DATABASE }}';
                SET @tables = CONCAT('DROP TABLE IF EXISTS ', @tables);
                PREPARE stmt FROM @tables;
                EXECUTE stmt;
                DEALLOCATE PREPARE stmt;
                SET FOREIGN_KEY_CHECKS = 1;
            " ${{ secrets.DB_DATABASE }} || echo "Gagal reset DB secara otomatis, silakan manual di phpMyAdmin"
            
            # 5. Sinkronisasi Laravel
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            # 7. Jalankan Migrasi
            php artisan migrate --force
            
            echo "🎉 Deployment Selesai dengan Kondisi Bersih!"