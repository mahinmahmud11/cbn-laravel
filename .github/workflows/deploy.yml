name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Cari lokasi folder secara rekursif berdasarkan file artisan
            echo "Mencari lokasi folder instalasi Laravel..."
            ARTISAN_PATH=$(find $HOME -name "artisan" -path "*/dev.citrabuananusantara.com/*" -type f | head -n 1)
            
            if [ -z "$ARTISAN_PATH" ]; then
                echo "File artisan untuk dev.citrabuananusantara.com tidak ditemukan! Mencoba pencarian umum..."
                ARTISAN_PATH=$(find $HOME -name "artisan" -type f | grep "dev" | head -n 1)
            fi
            
            if [ -z "$ARTISAN_PATH" ]; then
                echo "Folder tidak ditemukan sama sekali!"
                exit 1
            fi
            
            TARGET_PATH=$(dirname "$ARTISAN_PATH")
            cd "$TARGET_PATH"
            echo "Ditemukan di: $(pwd)"
            
            # 2. Reset dan tarik kode terbaru
            git config --global --add safe.directory $(pwd)
            echo "Menarik pembaruan dari branch staging..."
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. Buat file test untuk verifikasi akses via browser
            echo "<?php echo 'Deployment Success - ' . date('Y-m-d H:i:s'); ?>" > public/test-deploy.php
            
            # 3. Hapus cache fisik untuk memastikan tidak ada file nyangkut
            echo "Membersihkan Cache Fisik..."
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            # Ubah DB_HOST dari 127.0.0.1 menjadi localhost di file .env server
            echo "Menyesuaikan Konfigurasi Database (DB_HOST)..."
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 4. Jalankan instalasi dan optimasi
            echo "Menjalankan Composer Install..."
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            echo "Membersihkan Cache Konfigurasi & Aplikasi via Artisan..."
            php artisan optimize:clear
            
            # 5. EKSEKUSI MIGRASI SECARA PAKSA
            echo "Menjalankan Migrasi Database..."
            php artisan migrate --force
            
            echo "🎉 Deployment ke Staging Selesai dan Berhasil!"