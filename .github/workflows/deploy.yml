name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Cari lokasi asli folder tersebut di server
            TARGET_PATH=$(find $HOME -name "dev.citrabuananusantara.com" -type d | head -n 1)
            echo "Deploying to: $TARGET_PATH"
            
            if [ -z "$TARGET_PATH" ]; then
              echo "Folder tidak ditemukan!"
              exit 1
            fi
            
            cd "$TARGET_PATH"
            
            # 2. Paksa sinkronisasi (Reset Hard)
            git config --global --add safe.directory "$TARGET_PATH"
            if [ ! -d ".git" ]; then
              git init
              git remote add origin git@github.com:mahinmahmud11/cbn-laravel.git
              git fetch origin staging
              git checkout -f staging
            else
              git fetch origin staging
              git reset --hard origin/staging
            fi
            
            # 3. Jalankan perintah Laravel
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear