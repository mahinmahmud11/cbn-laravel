name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. Buat file pengetesan paling sederhana
            echo "<?php echo '<h1>Halo! Folder ini Aktif.</h1><p>Lokasi: ' . __FILE__ . '</p>'; ?>" > index.php
            
            # 3. Buat folder public dan isinya (jika subdomain mengarah ke sini)
            mkdir -p public
            echo "<?php echo '<h1>Halo! Folder PUBLIC ini Aktif.</h1><p>Lokasi: ' . __FILE__ . '</p>'; ?>" > public/index.php
            
            echo "Pengetesan jalur selesai."