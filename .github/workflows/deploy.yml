name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi ke folder root proyek
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. INVESTIGASI: Cari siapa yang memicu ship_status
            echo "--- INVESTIGASI: Mencari ship_status di seluruh folder server ---"
            grep -r "ship_status" . | grep -v "vendor" | grep -v "storage" | head -n 20
            
            echo "--- INVESTIGASI: Membaca isi jalankan.php ---"
            cat public/jalankan.php || echo "File jalankan.php tidak ditemukan di public/"
            
            # 3. Nuklir Mode (Bersihkan dan Tarik Ulang)
            git config --global --add safe.directory $(pwd)
            git clean -fd
            rm -rf database/migrations/*
            
            git fetch origin staging
            git reset --hard origin/staging
            
            # 4. Hapus cache fisik
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            # 5. Sesuaikan DB_HOST
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            # 7. Jalankan Migrasi
            php artisan migrate --force
            
            echo "🎉 Deployment Selesai!"