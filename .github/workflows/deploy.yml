name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # Masuk ke direktori web staging di cPanel
            cd /home/u7942055/dev.citrabuananusantara.com
            
            # Tarik kode terbaru dari GitHub (branch staging)
            git pull origin staging
            
            # Install/Update library PHP (Vendor)
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            # Update Database
            php artisan migrate --force
            
            # Bersihkan cache Laravel
            php artisan optimize:clear