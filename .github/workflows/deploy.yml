name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Identifikasi User dan Lokasi
            echo "USER: $(id)"
            echo "HOME: $HOME"
            
            # Gunakan path absolut berdasarkan screenshot File Manager
            TARGET_PATH="/home/u7942055/public_html/dev.citrabuananusantara.com"
            
            if [ ! -d "$TARGET_PATH" ]; then
                echo "Folder absolut tidak ditemukan! Mencari folder alternatif..."
                TARGET_PATH=$(find $HOME -name "dev.citrabuananusantara.com" -type d | head -n 1)
            fi
            
            cd "$TARGET_PATH"
            echo "Current Directory: $(pwd)"
            
            # 2. Reset dan tarik kode terbaru
            git config --global --add safe.directory $(pwd)
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. BRUTE FORCE TEST FILES (Buat di semua kemungkinan pintu masuk)
            TEST_CONTENT="<?php echo 'Deployment Success - ' . date('Y-m-d H:i:s') . ' - Path: ' . __FILE__; ?>"
            
            echo "$TEST_CONTENT" > public/test-deploy.php
            echo "$TEST_CONTENT" > test-deploy.php
            echo "$TEST_CONTENT" > ../test-deploy.php
            
            # 4. Hapus cache fisik secara agresif
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            # 5. Sesuaikan DB_HOST
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            # 7. EKSEKUSI MIGRASI SECARA PAKSA
            php artisan migrate --force
            
            echo "🎉 Deployment Selesai!"