name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            
            # 2. Reset OPcache secara paksa (Anti-Ghaib)
            echo "<?php opcache_reset(); echo 'OPcache Reset Success';" > public/reset-opcache.php
            curl -s https://dev.citrabuananusantara.com/reset-opcache.php
            rm public/reset-opcache.php
            
            # 3. Pembersihan Database & File
            git config --global --add safe.directory $(pwd)
            git clean -fd
            rm -rf database/migrations/*
            
            git fetch origin staging
            git reset --hard origin/staging
            
            # 4. Sed Agresif: Hapus paksa semua baris foreign key di semua file migrasi
            echo "Menghapus paksa semua baris foreign key dari folder migrasi di server..."
            find database/migrations -type f -exec sed -i '/foreign/d' {} +
            find database/migrations -type f -exec sed -i '/constrained/d' {} +
            
            # 5. Sinkronisasi Laravel
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            # 7. Jalankan Migrasi
            php artisan migrate --force
            
            echo "🎉 Deployment Selesai!"