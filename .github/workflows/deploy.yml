name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Navigasi ke folder root proyek
            cd /home/u7942055/public_html/dev.citrabuananusantara.com
            echo "Deploying to: $(pwd)"
            
            # 2. Paksa Bersihkan Kode Lama (Nuklir Mode)
            git config --global --add safe.directory $(pwd)
            echo "Membersihkan file untracked dan folder migrasi..."
            git clean -fd
            rm -rf database/migrations/*
            
            echo "Menarik pembaruan dari branch staging..."
            git fetch origin staging
            git reset --hard origin/staging
            
            # Verifikasi isi file migrasi yang bermasalah (untuk log)
            echo "Isi file migrasi shipment_pods di server:"
            cat database/migrations/2026_05_04_155012_create_shipment_pods_table.php
            
            # 3. Buat file test verifikasi
            echo "<?php echo 'Deployment Success - ' . date('Y-m-d H:i:s'); ?>" > public/test-deploy.php
            
            # 4. Hapus cache fisik
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            # 5. Sesuaikan DB_HOST
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan optimize:clear
            
            # 7. Jalankan Migrasi
            php artisan migrate --force
            
            echo "🎉 Deployment Selesai!"