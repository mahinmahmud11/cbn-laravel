name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Lokasi Alternatif (Sejajar dengan public_html)
            TARGET_ALT="/home/u7942055/dev.citrabuananusantara.com"
            
            echo "Mengecek lokasi: $TARGET_ALT"
            mkdir -p "$TARGET_ALT/public"
            echo "<?php echo '<h1>Halo! Ini Lokasi SIBLING public_html.</h1>'; ?>" > "$TARGET_ALT/public/index.php"
            echo "<?php echo '<h1>Halo! Ini Lokasi SIBLING public_html (Root).</h1>'; ?>" > "$TARGET_ALT/index.php"
            
            # 2. Lokasi di dalam Subdomains folder (Sering ada di cPanel)
            TARGET_SUB="/home/u7942055/public_html/subdomains/dev"
            mkdir -p "$TARGET_SUB/public"
            echo "<?php echo '<h1>Halo! Ini Lokasi SUBDOMAINS folder.</h1>'; ?>" > "$TARGET_SUB/public/index.php"
            
            echo "Pencarian folder aktif selesai."