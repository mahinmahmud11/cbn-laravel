name: Deploy to Staging (Dev)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Eksekusi Deployment ke Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          script: |
            # 1. Langsung menuju folder website yang benar (berdasarkan screenshot File Manager)
            cd ~/public_html/dev.citrabuananusantara.com
            echo "Deploying to: $(pwd)"
            
            # 2. Reset dan tarik kode terbaru
            git config --global --add safe.directory $(pwd)
            echo "Menarik pembaruan dari branch staging..."
            git fetch origin staging
            git reset --hard origin/staging
            
            # 3. Buat file test langsung di root (karena public di-merge ke root)
            echo "<?php echo 'Deployment Success - ' . date('Y-m-d H:i:s'); ?>" > test-deploy.php
            
            # 4. Hapus cache fisik secara agresif
            echo "Membersihkan Cache Fisik..."
            rm -rf bootstrap/cache/*.php
            rm -rf storage/framework/views/*.php
            
            # 5. Sesuaikan DB_HOST
            echo "Menyesuaikan Konfigurasi Database (DB_HOST)..."
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/g' .env
            
            # 6. Jalankan instalasi dan optimasi
            echo "Menjalankan Composer Install..."
            composer install --no-interaction --prefer-dist --optimize-autoloader
            
            echo "Membersihkan Cache Konfigurasi & Aplikasi via Artisan..."
            php artisan optimize:clear
            
            # 7. EKSEKUSI MIGRASI SECARA PAKSA
            echo "Menjalankan Migrasi Database..."
            php artisan migrate --force
            
            echo "🎉 Deployment ke Staging Selesai dan Berhasil!"